# StashVideoEditor.yml
name: Stash Video Editor
description: Visually crop and stretch a scene's video, re-encode with Stash's own settings, and swap it in as the primary file (non-destructive).
version: 0.1.0
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - cropMath.js
    - videoEditor.js
  css:
    - videoEditor.css
exec:
  - python3
  - "{pluginDir}/video_editor.py"
interface: raw
tasks:
  - name: Crop and re-encode
    description: Crop/stretch + re-encode a scene's video and set the result as primary file
    defaultArgs:
      mode: crop_reencode
  - name: Merge edited scenes
    description: Fallback/cleanup — merge any orphan *.edited scenes into their source scenes (normally automatic via the hook)
    defaultArgs:
      mode: merge
hooks:
  - name: Merge edited file into source scene
    description: When a scan creates a *.edited scene, merge it into the source scene as primary (finishes the crop task; avoids the serial-job-queue deadlock).
    triggeredBy:
      - Scene.Create.Post
