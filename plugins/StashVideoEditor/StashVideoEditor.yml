# StashVideoEditor.yml
name: Stash Video Editor
description: Visually crop, stretch, or trim a scene's video and swap the result in as the primary file (non-destructive). Crop/stretch re-encode with Stash's own settings; trim is lossless (stream-copy) or precision (re-encode). Crop/stretch also work on image clips (.vclip) from the image page via an overwrite-in-place swap.
version: 0.3.0
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - cropMath.js
    - playability.js
    - timeMath.js
    - spriteVtt.js
    - videoEditor.js
  css:
    - videoEditor.css
exec:
  - python3
  - "{pluginDir}/video_editor.py"
interface: raw
tasks:
  - name: Crop and re-encode
    description: Crop/stretch + re-encode a scene's video and set the result as primary file
    defaultArgs:
      mode: crop_reencode
  - name: Trim
    description: Trim a scene to one in/out range (lossless stream-copy or precision re-encode) and set the result as primary file
    defaultArgs:
      mode: trim
  - name: Merge edited scenes
    description: Fallback/cleanup — merge any orphan *.edited scenes into their source scenes (normally automatic via the hook)
    defaultArgs:
      mode: merge
hooks:
  - name: Merge edited file into source scene
    description: When a scan creates a *.edited scene, merge it into the source scene as primary (finishes the crop task; avoids the serial-job-queue deadlock).
    triggeredBy:
      - Scene.Create.Post
